{% extends "base.html" %}
{% load static %}
{% block main-content %}
<div class="container text-center mt-5">
  <div class="card mb-3 text-center" style="max-width: 900px;">
    <div class="row text-center align-items-center justify-content-center">
      <div class="col-md-12">
        <div class="card-body">
          <h5 class="card-title text-uppercase text-danger">{{request.user.username}}</h5>
          <h4 class="text-primary mb-4">Create News</h4>
          <form method="POST" enctype="multipart/form-data" action="{% url 'profile' %}">
            {% csrf_token %}
            {{form}}
            <input class="btn btn-primary text-white w-50 mt-3" type="submit" name="news_submit" value="POST NEWS">
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <!-- User Profile Edit Section -->
  <div class="card mb-3 text-center" style="max-width: 900px;">
    <div class="row text-center align-items-center justify-content-center">
      <div class="col-md-12">
        <div class="card-body">
          <h4 class="text-primary mb-4">EDIT PROFILE</h4>
          <form method="POST" action="{% url 'profile' %}">
            {% csrf_token %}
            {{user_form}}
            <input class="btn btn-success text-white w-50 mt-3" type="submit" name="profile_submit" value="UPDATE PROFILE">
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock main-content %}
